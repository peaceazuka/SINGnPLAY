name: Deploy website to Cloudflare Pages

on:
  push:
    branches:
      - claude/upbeat-pascal-0sdcxw
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        working-directory: website
        # Fails harmlessly if the project already exists; only matters on
        # the very first run.
        run: npx wrangler pages project create singnplay --production-branch=${{ github.ref_name }} || true

      - name: Deploy to Cloudflare Pages
        working-directory: website
        run: npx wrangler pages deploy dist --project-name=singnplay --commit-dirty=true
